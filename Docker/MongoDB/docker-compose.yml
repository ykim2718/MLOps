# docker-compose.yml
# __version__ = "0.0.12"

name: mongodb                       # Fix the project name (prefix of container and volume names).

services:
  mongo:
    image: mongo:7
    command: ["mongod", "--auth"]   # enforce authentication (root user already created in the volume)
    env_file:
      - docker-compose.env_example          # injects MONGO_INITDB_ROOT_USERNAME / MONGO_INITDB_ROOT_PASSWORD
    ports:
      - "27017:27017"               # expose for host python/tools and other machines to connect
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # ping needs no authentication even when auth is enabled, so no credentials here
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"]
      interval: 5s
      retries: 10
    networks:
      - mlops
    restart: unless-stopped
    logging:
      driver: json-file             # default driver. stores stdout logs as JSON files.
      options:
        max-size: "10m"             # rotate when a single file exceeds 10MB.
        max-file: "10"              # keep up to 10 files, deleting the oldest first.

volumes:
  mongo-data:

networks:
  mlops:
    external: true
